<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Prayers and Healings</title>
<meta name="description" content="Get in touch with Prayers and Healings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
  <div class="nav">
    <a href="/" class="brand"><img src="/images/home/prayersandhealings-logo.png" alt="Prayers and Healings logo"><span>Prayers and Healings</span></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">&#9776;</button>
    <nav><ul id="navMenu">
      <li><a href="/">Home</a></li>
      <li><a href="/about.html">About</a></li>
      <li><a href="/blog.html">Blog</a></li>
      <li><a href="/prayer-wall.php">Prayer Wall</a></li>
      <li><a href="/contact.html" class="active">Contact</a></li>
    </ul></nav>
  </div>
</header>

<div class="wrap-form">
  <div class="page-hero">
    <span class="eyebrow">Get in Touch</span>
    <h1>Contact Us</h1>
    <p>Questions, feedback, or want to get involved? We'd love to hear from you.</p>
  </div>

  <form class="card-form" id="contactForm">
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Your email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit" class="btn btn-full" id="submitBtn">Send Message</button>
    <div id="formMessage"></div>
  </form>
</div>

<footer>
  <div class="footer-inner">
    <a href="/" class="brand"><img src="/images/home/prayersandhealings-logo.png" alt="Prayers and Healings logo" style="height:34px;width:34px;"><span>Prayers and Healings</span></a>
    <p class="fine">&copy; <span id="year"></span> Prayers and Healings. Held with care, for every faith and every journey.</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  document.getElementById('menuToggle').addEventListener('click', function(){ document.getElementById('navMenu').classList.toggle('open'); });

  document.getElementById('contactForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('formMessage');
    btn.disabled = true; btn.textContent = 'Sending...';
    msg.className = ''; msg.style.display = 'none';
    const formData = new FormData(this);
    try {
      const res = await fetch('/contact-submit.php', { method: 'POST', body: formData });
      const data = await res.json();
      msg.textContent = data.message;
      msg.className = data.success ? 'success' : 'error';
      if (data.success) this.reset();
    } catch (err) {
      msg.textContent = 'Could not send. Please try again shortly.';
      msg.className = 'error';
    }
    btn.disabled = false; btn.textContent = 'Send Message';
  });
</script>

</body>
</html>
